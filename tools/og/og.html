<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;width:1200px;height:630px;font-family:'Instrument Sans';color:#fbfcf8;position:relative;overflow:hidden;background:#17281e}

<img class="bg" src="../../assets/img/hero.jpg"><div class="sh"></div>

</body></html>
